name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src/ tests/ scripts/
      - name: Unit tests
        run: pytest tests/ -v
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt -r src/investigator/requirements.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  validate-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - name: Validate SAM template
        run: sam validate --lint --region us-east-1
